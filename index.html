<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutor IA · Inglés asistido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="app">

        <!-- ============ HEADER ============ -->
        <header class="app-header">
            <button class="icon-btn" data-action="toggle-history" aria-label="Abrir chats recientes" title="Chats recientes" aria-expanded="false" aria-controls="history-drawer">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
            </button>
            <div class="brand-lockup" aria-label="Lingua IA" title="Lingua IA">
                <img src="images/lingua-ia-logo.png" alt="Lingua IA">
            </div>
            <span class="header-divider" aria-hidden="true"></span>

            <nav class="mode-nav" id="mode-nav" aria-label="Modos de práctica">
                <button class="mode-pill is-active" data-action="open-quickstart" data-view="quickstart" aria-current="page">Dudas rápidas</button>
                <button class="mode-pill" data-action="set-mode" data-mode="conversation">Conversación escrita</button>
                <button class="mode-pill" data-action="set-mode" data-mode="lessons">Lecciones y repaso</button>
                <button class="mode-pill" data-action="set-mode" data-mode="writing">Redacción asistida</button>
            </nav>

            <div class="header-spacer"></div>

            

            <button class="suggestion-btn" id="suggestions-btn" data-action="toggle-suggestions" aria-expanded="false" aria-controls="suggestions-popover" aria-label="Sugerencias para este paso" title="Sugerencias para este paso">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg>
                <span>Ayuda para este paso</span>
            </button>

            <div class="popover" id="suggestions-popover" hidden></div>
        </header>

        <main class="quickstart-view" id="quickstart-view">
            <section class="quickstart-content" aria-labelledby="quickstart-title">
                <p class="quickstart-eyebrow">Inicio</p>
                <h1 id="quickstart-title">¿Qué necesitas practicar?</h1>
                <p class="quickstart-intro">Escribe tu duda y te dirigimos a la actividad que corresponde. También puedes elegir una tarea arriba.</p>
                <form class="quickstart-form" id="quickstart-form">
                    <label class="sr-only" for="quickstart-input">Escribe tu duda en español o inglés</label>
                    <textarea id="quickstart-input" rows="2" placeholder="Ej.: ¿Puedes revisar este correo? ¿Qué significa “dedicated”? Quiero practicar una entrevista."></textarea>
                    <button class="btn btn-primary" type="submit">Continuar</button>
                </form>
                <p class="quickstart-feedback" id="quickstart-feedback" role="status" hidden></p>
                <div class="quickstart-options" role="group" aria-label="Elegir una actividad">
                    <button class="quickstart-option" data-action="set-mode" data-mode="writing"><strong>Redacción asistida</strong><span>Revisar un texto y decidir qué cambios conservar.</span></button>
                    <button class="quickstart-option" data-action="set-mode" data-mode="lessons"><strong>Lecciones y repaso</strong><span>Consultar vocabulario en una lectura y ver ejemplos.</span></button>
                    <button class="quickstart-option" data-action="set-mode" data-mode="conversation"><strong>Conversación escrita</strong><span>Practicar respuestas en un escenario breve.</span></button>
                </div>
            </section>
        </main>

        <!-- ============ WORKSPACE ============ -->
        <div class="workspace">
            <main class="chat-column">
                <h1 class="sr-only" id="page-title">Lingua IA · Redacción asistida</h1>
                <div class="stagebar" id="stagebar"></div>

                <div class="chat-scroll" id="chat-scroll">
                    <div class="chat-messages" id="chat-messages"></div>
                </div>

                <div class="side-query" id="side-query" hidden></div>

                <div class="composer">
                    <div class="help-levels" id="help-levels" role="group" aria-label="Nivel de ayuda"></div>
                    <form class="composer-box" id="chat-form">
                        <label class="sr-only" for="chat-input">Escribe tu mensaje</label>
                        <textarea id="chat-input" rows="1" placeholder="Pregunta algo sobre tu texto o escribe otra frase…"></textarea>
                        <button type="submit" class="round-btn primary" id="send-btn" aria-label="Enviar mensaje" title="Enviar">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                        </button>
                    </form>
                    <div class="composer-hint">
                        <span>Enter envía · Shift + Enter salto de línea</span>
                        <span id="composer-mode-hint">Modo: Redacción asistida</span>
                    </div>
                </div>
            </main>

            <aside class="side-panel" id="side-panel" aria-label="Panel de apoyo">
                <button class="mobile-support-close" data-action="close-mobile-support">Cerrar apoyo</button>
                <div class="aside-tabs" id="aside-tabs" role="tablist"></div>
                <div class="aside-content" id="aside-content"></div>
            </aside>
        </div>

    </div>

    <!-- Overlays -->
    <div class="history-overlay" id="history-overlay" data-action="close-history" hidden></div>
    <aside class="history-drawer" id="history-drawer" hidden aria-label="Chats recientes organizados por tarea"></aside>
    <div class="mobile-support-overlay" id="mobile-support-overlay" data-action="close-mobile-support" hidden></div>
    <div class="modal-overlay" id="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal"></div>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="sr-only" id="live-region" aria-live="polite"></div>

    <script src="js/icons.js"></script>
    <script src="js/data.js"></script>
    <script src="js/state.js"></script>
    <script src="js/corrections.js"></script>
    <script src="js/panels.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
